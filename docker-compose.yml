services:
  postgres:
    image: postgres:16-alpine
    container_name: girlcan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: girlcan
      POSTGRES_PASSWORD: girlcan
      POSTGRES_DB: girlcan
    volumes:
      - girlcan_pgdata:/var/lib/postgresql/data

volumes:
  girlcan_pgdata:
